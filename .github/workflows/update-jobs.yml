name: Update jobs and publish site

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["site/**", "brands.yaml", "scraper/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect job postings
        run: python -m scraper.run
      - name: Save today's results to the repo
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Update job postings $(date -u +%F)"
          git push || echo "Nothing to push"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
